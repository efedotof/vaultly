services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaultly
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d vaultly"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: vaultly-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   
      - "9001:9001"   
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: vaultly-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      mc mb --ignore-existing myminio/${S3_BUCKET};
      mc anonymous set download myminio/${S3_BUCKET};
      echo 'MinIO bucket готов';
      exit 0;
      "

  vaultly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultly-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vaultly
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      SERVER_PORT: ${SERVER_PORT}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      SERVER_PRIVATE_KEY_PATH: ${SERVER_PRIVATE_KEY_PATH}
      SERVER_PUBLIC_KEY_PATH: ${SERVER_PUBLIC_KEY_PATH}
      app.base-url: ${APP_BASE_URL}

    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    volumes:
      - ./keys:/app/keys:ro
      - ./uploads:/app/uploads
      - ./temp:/app/temp
      - ./logs:/app/logs

volumes:
  postgres_data:
  minio_data: