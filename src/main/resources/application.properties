spring.config.import=optional:file:.env

spring.application.name=vaultly
server.port=${SERVER_PORT}  

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=100MB

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.encryption.master-key=${ENCRYPTION_MASTER_KEY}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.jpa.properties.javax.persistence.validation.mode=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

cloud.aws.s3.endpoint=${S3_ENDPOINT}
cloud.aws.s3.region=${S3_REGION:ru-1}
cloud.aws.s3.access-key=${S3_ACCESS_KEY}
cloud.aws.s3.secret-key=${S3_SECRET_KEY}
cloud.aws.s3.bucket=${S3_BUCKET}

logging.level.root=WARN

logging.level.com.efedotov.vaultly=DEBUG

logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.boot=INFO


logging.level.com.zaxxer.hikari=DEBUG

logging.level.cloud.aws=INFO
logging.level.com.amazonaws=WARN

logging.level.org.flywaydb=INFO

logging.level.org.apache=WARN

logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=WARN
logging.level.org.hibernate.engine.transaction=WARN
logging.level.org.hibernate.engine.jdbc=WARN

spring.output.ansi.enabled=NEVER
spring.main.banner-mode=off

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

logging.file.name=logs/vaultly.log

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

file.storage.base-path=uploads
file.storage.temp-path=temp
file.storage.max-filename-length=255