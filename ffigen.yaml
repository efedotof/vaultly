name: ShirmCryptoBindings
description: |
  Bindings for `src/shirm_crypto.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/shirm_crypto_bindings_generated.dart'
headers:
  entry-points:
    - 'src/shirm_crypto.h'
  include-directives:
    - '**/src/shirm_crypto.h'
compiler-opts:
  - '-I/usr/include'
  - '-I/usr/local/include'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
comments:
  style: any
  length: full