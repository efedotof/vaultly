name: Build and Release Desktop and Android Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'

      - name: Repair Flutter pub cache
        run: flutter pub cache repair

      - name: Clean previous builds
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Create key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../upload-keystore.p12
          EOF

      - name: Decode keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $ENCODED_STRING > keystore-b64.txt
          base64 -d keystore-b64.txt > android/upload-keystore.p12

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build signed APK
        run: flutter build apk --release

      - name: Get version from pubspec
        id: version
        run: |
          version=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Upload APK to release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build for Windows (Velopack)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'

      - name: Repair Flutter pub cache
        run: flutter pub cache repair

      - name: Clean previous builds
        run: flutter clean

      - name: Enable windows support
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build OpenSSL for Windows (MSVC)
        run: |
          curl -LO "https://github.com/openssl/openssl/releases/download/openssl-4.0.0/openssl-4.0.0.tar.gz"
          tar xzf openssl-4.0.0.tar.gz
          cd openssl-4.0.0
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          perl Configure VC-WIN64A no-shared no-tests -static --prefix=%CD%\..\out
          nmake
          nmake install_sw
        shell: cmd

      - name: Verify OpenSSL output
        shell: powershell
        run: |
          Write-Host "Generated .lib files:"
          Get-ChildItem out\lib
          Write-Host "Generated headers:"
          Get-ChildItem out\include

      - name: Copy MSVC libs (OpenSSL + zlib) to plugin cache
        shell: powershell
        run: |
          $gitCache = "$env:LOCALAPPDATA\Pub\Cache\git"
          $pluginDir = Get-ChildItem -Path $gitCache -Directory -Filter "vaultly-*" | Select-Object -First 1
          if (-not $pluginDir) {
            Write-Host "##[error] Plugin cache not found"
            exit 1
          }
          $targetLib = "$($pluginDir.FullName)\windows\openssl_prebuild\windows\x86_64"
          $targetInc = "$($pluginDir.FullName)\windows\openssl_prebuild\windows\include"
          New-Item -ItemType Directory -Force -Path $targetLib
          New-Item -ItemType Directory -Force -Path $targetInc

          Copy-Item -Path out\lib\libssl.lib -Destination $targetLib -Force
          Copy-Item -Path out\lib\libcrypto.lib -Destination $targetLib -Force
          Copy-Item -Path out\include\* -Destination $targetInc -Recurse -Force

          vcpkg install zlib:x64-windows
          $vcpkgRoot = (Get-Item env:VCPKG_INSTALLATION_ROOT).Value
          $zlibInclude = "$vcpkgRoot\installed\x64-windows\include"
          $zlibLib     = "$vcpkgRoot\installed\x64-windows\lib\zlib.lib"
          Copy-Item -Path $zlibLib -Destination $targetLib -Force
          Copy-Item -Path "$zlibInclude\zlib.h" -Destination $targetInc -Force
          Copy-Item -Path "$zlibInclude\zconf.h" -Destination $targetInc -Force

          Write-Host "Copied to $targetLib"
          Get-ChildItem $targetLib

      - name: Clean previous Windows build
        run: flutter clean

      - name: Copy VC++ runtime DLLs next to exe
        shell: powershell
        run: |
          $exeDir = "build\windows\x64\runner\Release"
          $vcDir = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\14.42.34433\x64\Microsoft.VC143.CRT"
          Copy-Item "$vcDir\vcruntime140.dll" $exeDir -Force
          Copy-Item "$vcDir\msvcp140.dll" $exeDir -Force
          Write-Host "Copied VC++ runtime DLLs to $exeDir"

      - name: Build Windows app (release)
        run: flutter build windows --release

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk

      - name: Get version from pubspec (clean)
        id: version
        shell: bash
        run: |
          raw_version=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          clean_version="${raw_version%%+*}"
          echo "clean_version=$clean_version" >> $GITHUB_OUTPUT
          echo "Raw: $raw_version -> Clean: $clean_version"

      - name: Copy icon for Velopack
        run: |
          if (Test-Path "windows/runner/resources/app_icon.ico") {
            Copy-Item "windows/runner/resources/app_icon.ico" -Destination "build/windows/x64/runner/Release/app.ico"
            Write-Host "Icon copied successfully"
          } else {
            Write-Host "::warning::Icon not found at windows/runner/resources/app_icon.ico"
          }

      - name: Pack Windows with Velopack
        run: |
          vpk pack --packId "Vaultly" `
            --packVersion "${{ steps.version.outputs.clean_version }}" `
            --packDir "build/windows/x64/runner/Release" `
            --outputDir "./artifacts" `
            --mainExe "vaulth_app.exe" `
            --icon "build/windows/x64/runner/Release/app.ico" `
            --channel win

      - name: Upload Windows artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/*.exe
            ./artifacts/*.nupkg
            ./artifacts/releases.win.json   
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-velopack:
    name: Build macOS Velopack (auto-update)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'

      - name: Repair Flutter pub cache
        run: flutter pub cache repair

      - name: Clean previous builds
        run: flutter clean

      - name: Enable macOS support
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Get version from pubspec (clean)
        id: version
        shell: bash
        run: |
          raw_version=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          clean_version="${raw_version%%+*}"
          echo "clean_version=$clean_version" >> $GITHUB_OUTPUT

      - name: Build macOS ARM
        run: FLUTTER_XCODE_ARCHS=arm64 flutter build macos --release

      - name: Copy ARM app outside build directory
        run: cp -R build/macos/Build/Products/Release/Vaultly.app /tmp/Vaultly_arm64.app

      - name: Clean for Intel build
        run: |
          rm -rf build/macos
          flutter clean

      - name: Build macOS Intel
        run: FLUTTER_XCODE_ARCHS=x86_64 flutter build macos --release

      - name: Copy Intel app outside build directory
        run: cp -R build/macos/Build/Products/Release/Vaultly.app /tmp/Vaultly_x86_64.app

      - name: Create universal binary (Intel as base, add ARM slices)
        run: |
          UNIVERSAL="/tmp/Vaultly_universal.app"
          cp -R /tmp/Vaultly_x86_64.app "$UNIVERSAL"

          # Главный бинарник
          lipo -create \
            /tmp/Vaultly_arm64.app/Contents/MacOS/Vaultly \
            "$UNIVERSAL/Contents/MacOS/Vaultly" \
            -output "$UNIVERSAL/Contents/MacOS/Vaultly"

          # Фреймворки
          for framework in "$UNIVERSAL/Contents/Frameworks/"*.framework; do
            fname=$(basename "$framework" .framework)
            bin="Versions/A/${fname}"
            intel_bin="${framework}/${bin}"
            arm_bin="/tmp/Vaultly_arm64.app/Contents/Frameworks/${fname}.framework/${bin}"
            if [ -f "$intel_bin" ] && [ -f "$arm_bin" ]; then
              echo "Making universal: $fname"
              lipo -create "$arm_bin" "$intel_bin" -output "$intel_bin"
            fi
          done

          cp -R "$UNIVERSAL" /tmp/vaulth_app.app

      - name: Move final app to build directory for Velopack
        run: |
          mkdir -p build/macos/Build/Products/Release
          mv /tmp/vaulth_app.app build/macos/Build/Products/Release/vaulth_app.app

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk

      - name: Pack with Velopack
        run: |
          vpk pack \
            --packId "Vaultly" \
            --packVersion "${{ steps.version.outputs.clean_version }}" \
            --packDir "build/macos/Build/Products/Release/vaulth_app.app" \
            --outputDir "./artifacts" \
            --channel osx

      - name: Upload Velopack artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/*.nupkg
            ./artifacts/releases.osx.json
            ./artifacts/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}