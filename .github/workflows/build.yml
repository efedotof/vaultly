name: Build and Release Desktop and Android Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Create key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../upload-keystore.p12
          EOF

      - name: Decode keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $ENCODED_STRING > keystore-b64.txt
          base64 -d keystore-b64.txt > android/upload-keystore.p12

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        run: |
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install OpenSSL for Android
        run: |
          git clone https://github.com/openssl/openssl.git --depth 1 --branch openssl-3.0.13
          cd openssl
          export TOOLCHAIN=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64
          for ARCH in arm64-v8a armeabi-v7a x86_64; do
            case $ARCH in
              arm64-v8a)   TARGET=android-arm64;;
              armeabi-v7a) TARGET=android-arm;;
              x86_64)      TARGET=android-x86_64;;
            esac
            export PATH=$TOOLCHAIN/bin:$PATH
            ./Configure $TARGET -D__ANDROID_API__=21 --prefix=$PWD/../openssl_$ARCH
            make -j$(nproc)
            make install_sw
            make clean
          done

      - name: Install zlib for Android
        run: |
          git clone https://github.com/madler/zlib.git --depth 1
          cd zlib
          for ARCH in arm64-v8a armeabi-v7a x86_64; do
            mkdir build_$ARCH && cd build_$ARCH
            cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                    -DANDROID_ABI=$ARCH -DANDROID_PLATFORM=android-21 \
                    -DCMAKE_INSTALL_PREFIX=../../zlib_$ARCH
            make -j$(nproc)
            make install
            cd ..
          done
        
      - name: Build signed APK
        run: flutter build apk --release

      - name: Get version from pubspec
        id: version
        run: |
          version=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Upload APK to release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build for Windows (Velopack)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'

      - name: Enable windows support
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Install OpenSSL and zlib via vcpkg
        run: |
          vcpkg install openssl:x64-windows zlib:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows app (release)
        run: flutter build windows --release

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk

      - name: Get version from pubspec (clean)
        id: version
        shell: bash
        run: |
          raw_version=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          clean_version="${raw_version%%+*}"
          echo "clean_version=$clean_version" >> $GITHUB_OUTPUT
          echo "Raw: $raw_version -> Clean: $clean_version"

      - name: Copy icon for Velopack
        run: |
          if (Test-Path "windows/runner/resources/app_icon.ico") {
            Copy-Item "windows/runner/resources/app_icon.ico" -Destination "build/windows/x64/runner/Release/app.ico"
            Write-Host "Icon copied successfully"
          } else {
            Write-Host "::warning::Icon not found at windows/runner/resources/app_icon.ico"
          }

      - name: Pack Windows with Velopack
        run: |
          vpk pack --packId "Vaultly" `
            --packVersion "${{ steps.version.outputs.clean_version }}" `
            --packDir "build/windows/x64/runner/Release" `
            --outputDir "./artifacts" `
            --mainExe "vaulth_app.exe" `
            --icon "build/windows/x64/runner/Release/app.ico" `
            --channel win

      - name: Upload Windows artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/*.exe
            ./artifacts/*.nupkg
            ./artifacts/releases.win.json   
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-velopack:
    name: Build macOS Velopack (auto-update)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'

      - name: Enable macOS support
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Get version from pubspec (clean)
        id: version
        shell: bash
        run: |
          raw_version=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          clean_version="${raw_version%%+*}"
          echo "clean_version=$clean_version" >> $GITHUB_OUTPUT

      - name: Install OpenSSL and zlib
        run: |
          brew install openssl zlib
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl)" >> $GITHUB_ENV
          echo "ZLIB_ROOT=$(brew --prefix zlib)" >> $GITHUB_ENV

      - name: Build macOS app (release)
        run: flutter build macos --release

      - name: Rename app to vaulth_app.app for consistency
        run: |
          if [ -d "build/macos/Build/Products/Release/Vaultly.app" ]; then
            mv build/macos/Build/Products/Release/Vaultly.app build/macos/Build/Products/Release/vaulth_app.app
          fi

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk

      - name: Pack with Velopack
        run: |
          vpk pack \
            --packId "Vaultly" \
            --packVersion "${{ steps.version.outputs.clean_version }}" \
            --packDir "build/macos/Build/Products/Release/vaulth_app.app" \
            --outputDir "./artifacts" \
            --channel osx

      - name: Upload Velopack artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/*.nupkg
            ./artifacts/releases.osx.json
            ./artifacts/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}