name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.0'
  APP_BINARY: vaulth_app
  APP_PRODUCT: Vaultly

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.p12
          ls -la android/upload-keystore.p12

      - name: key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.p12
          EOF

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Verify signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs "$APK" | grep -i 'SHA-256'

      - name: Stage APK + zip
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          mkdir -p dist staging/android
          cp build/app/outputs/flutter-apk/app-release.apk "dist/qnd_updater-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk staging/android/qnd_updater.apk
          ( cd staging/android && zip -q "$GITHUB_WORKSPACE/dist/qnd_updater-${TAG}-android.zip" qnd_updater.apk )
          ls -la dist/

      - name: Cleanup secrets
        if: always()
        run: rm -f android/key.properties android/upload-keystore.p12

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - name: Build
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package zip + portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item -Recurse -Force "build/windows/x64/runner/Release/*" "dist/windows/"
          Compress-Archive `
            -Path "dist/windows/*" `
            -DestinationPath "dist/qnd_updater-${{ github.ref_name }}-windows.zip" -Force
          Copy-Item `
            "build/windows/x64/runner/Release/${{ env.APP_BINARY }}.exe" `
            "dist/qnd_updater-${{ github.ref_name }}-windows.exe" -Force

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) {
            $found = Get-ChildItem -Path "C:\" -Filter "makensis.exe" -Recurse -EA SilentlyContinue | Select-Object -First 1
            if (-not $found) { Write-Error "makensis not found"; exit 1 }
            $nsis = $found.DirectoryName
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis

      - name: Build NSIS installer
        shell: bash
        run: |
          set -e
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | xargs)
          APP_BIN="${{ env.APP_BINARY }}"
          APP_PROD="${{ env.APP_PRODUCT }}"

          rm -rf nsis_payload && mkdir -p nsis_payload
          cp -R build/windows/x64/runner/Release/* nsis_payload/

          cat > installer.nsi <<NSIEOF
          !include "MUI2.nsh"
          Name "${APP_PROD}"
          OutFile "dist\\qnd_updater-\${REF_NAME}-windows-setup.exe"
          InstallDir "\$PROGRAMFILES64\\${APP_PROD}"
          RequestExecutionLevel admin
          Unicode true

          !define MUI_FINISHPAGE_RUN "\$INSTDIR\\${APP_BIN}.exe"
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_LANGUAGE "English"
          !insertmacro MUI_LANGUAGE "Russian"

          Section "Install"
            SetOutPath "\$INSTDIR"
            File /r "nsis_payload\\*.*"
            CreateDirectory "\$SMPROGRAMS\\${APP_PROD}"
            CreateShortcut "\$SMPROGRAMS\\${APP_PROD}\\${APP_PROD}.lnk" "\$INSTDIR\\${APP_BIN}.exe"
            CreateShortcut "\$DESKTOP\\${APP_PROD}.lnk" "\$INSTDIR\\${APP_BIN}.exe"
            WriteUninstaller "\$INSTDIR\\uninstall.exe"
            WriteRegStr HKLM "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\${APP_PROD}" "DisplayName" "${APP_PROD}"
            WriteRegStr HKLM "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\${APP_PROD}" "DisplayVersion" "\${VERSION}"
            WriteRegStr HKLM "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\${APP_PROD}" "UninstallString" "\$INSTDIR\\uninstall.exe"
          SectionEnd

          Section "Uninstall"
            Delete "\$DESKTOP\\${APP_PROD}.lnk"
            RMDir /r "\$SMPROGRAMS\\${APP_PROD}"
            RMDir /r "\$INSTDIR"
            DeleteRegKey HKLM "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\${APP_PROD}"
          SectionEnd
          NSIEOF

          MAKENSIS=$(command -v makensis || true)
          [ -z "$MAKENSIS" ] && MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          [ -f "$MAKENSIS" ] || { echo "makensis not found"; exit 1; }

          MSYS_NO_PATHCONV=1 "$MAKENSIS" -V2 \
            -DREF_NAME="${{ github.ref_name }}" -DVERSION="$VERSION" installer.nsi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglu1-mesa wget imagemagick zip
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Version file + bundle
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | xargs)
          echo "$VERSION" > build/linux/x64/release/bundle/version

      - name: Zip (auto-update)
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p dist
          ( cd build/linux/x64/release/bundle && zip -qry "$GITHUB_WORKSPACE/dist/qnd_updater-${TAG}-linux.zip" . )

      - name: .run installer
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          APP_BIN="${{ env.APP_BINARY }}"
          APP_PROD="${{ env.APP_PRODUCT }}"
          BUNDLE=build/linux/x64/release/bundle

          rm -rf /tmp/run_payload && mkdir -p /tmp/run_payload
          cp -R "$BUNDLE"/* /tmp/run_payload/
          ( cd /tmp/run_payload && tar -czf /tmp/payload.tar.gz . )

          cat > /tmp/installer_header.sh <<RUNEOF
          #!/bin/bash
          set -e
          APP_BIN="${APP_BIN}"
          APP_PROD="${APP_PROD}"
          DEFAULT_DIR="\$HOME/.local/share/\${APP_BIN}"
          read -e -p "Куда установить? [\$DEFAULT_DIR]: " INSTALL_DIR
          INSTALL_DIR="\${INSTALL_DIR:-\$DEFAULT_DIR}"
          INSTALL_DIR="\${INSTALL_DIR/#\\~/\$HOME}"
          if [ -e "\$INSTALL_DIR" ]; then
            read -p "Директория существует. Перезаписать? [y/N]: " a
            case "\$a" in [yY]*) rm -rf "\$INSTALL_DIR" ;; *) exit 1 ;; esac
          fi
          mkdir -p "\$INSTALL_DIR"
          PAYLOAD_LINE=\$(awk '/^__PAYLOAD_BELOW__$/{print NR + 1; exit 0;}' "\$0")
          tail -n +\$PAYLOAD_LINE "\$0" | tar -xz -C "\$INSTALL_DIR"
          chmod +x "\$INSTALL_DIR/\$APP_BIN"
          mkdir -p "\$HOME/.local/share/applications"
          cat > "\$HOME/.local/share/applications/\${APP_BIN}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=\$APP_PROD
          Exec=\$INSTALL_DIR/\$APP_BIN
          Categories=Utility;
          Terminal=false
          EOF
          chmod +x "\$HOME/.local/share/applications/\${APP_BIN}.desktop"
          mkdir -p "\$HOME/.local/bin"
          ln -sf "\$INSTALL_DIR/\$APP_BIN" "\$HOME/.local/bin/\${APP_BIN}"
          echo "Установлено в \$INSTALL_DIR"
          exit 0
          __PAYLOAD_BELOW__
          RUNEOF

          RUN="$GITHUB_WORKSPACE/dist/qnd_updater-${TAG}-linux-setup.run"
          cat /tmp/installer_header.sh /tmp/payload.tar.gz > "$RUN"
          chmod +x "$RUN"

      - name: AppImage
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          APP_BIN="${{ env.APP_BINARY }}"
          APP_PROD="${{ env.APP_PRODUCT }}"
          BUNDLE=build/linux/x64/release/bundle

          wget -q -O /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool

          APPDIR=/tmp/AppDir
          rm -rf "$APPDIR" && mkdir -p "$APPDIR/usr/bin"
          cp -R "$BUNDLE"/* "$APPDIR/usr/bin/"

          cat > "$APPDIR/${APP_BIN}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${APP_PROD}
          Exec=${APP_BIN}
          Icon=${APP_BIN}
          Categories=Utility;
          Terminal=false
          EOF

          if [ -f "$BUNDLE/data/flutter_assets/assets/logo_r.png" ]; then
            cp "$BUNDLE/data/flutter_assets/assets/logo_r.png" "$APPDIR/${APP_BIN}.png"
          else
            convert -size 256x256 xc:'#673AB7' "$APPDIR/${APP_BIN}.png"
          fi

          cat > "$APPDIR/AppRun" <<EOF
          #!/bin/bash
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          exec "\${HERE}/usr/bin/${APP_BIN}" "\$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            "$APPDIR" "$GITHUB_WORKSPACE/dist/qnd_updater-${TAG}-linux.AppImage"

      - name: .deb
        run: |
          set -e
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | xargs)
          APP_BIN="${{ env.APP_BINARY }}"
          APP_PROD="${{ env.APP_PRODUCT }}"
          BUNDLE=build/linux/x64/release/bundle

          PKG=/tmp/qnd-updater_${VERSION}_amd64
          rm -rf "$PKG"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/lib/${APP_BIN}" "$PKG/usr/bin" \
                   "$PKG/usr/share/applications" \
                   "$PKG/usr/share/icons/hicolor/256x256/apps"
          cp -R "$BUNDLE"/* "$PKG/usr/lib/${APP_BIN}/"

          cat > "$PKG/usr/bin/${APP_BIN}" <<EOF
          #!/bin/bash
          exec /usr/lib/${APP_BIN}/${APP_BIN} "\$@"
          EOF
          chmod +x "$PKG/usr/bin/${APP_BIN}"

          cat > "$PKG/usr/share/applications/${APP_BIN}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${APP_PROD}
          Exec=${APP_BIN}
          Icon=${APP_BIN}
          Categories=Utility;
          Terminal=false
          EOF

          if [ -f "$BUNDLE/data/flutter_assets/assets/logo_r.png" ]; then
            cp "$BUNDLE/data/flutter_assets/assets/logo_r.png" \
               "$PKG/usr/share/icons/hicolor/256x256/apps/${APP_BIN}.png"
          else
            convert -size 256x256 xc:'#673AB7' \
              "$PKG/usr/share/icons/hicolor/256x256/apps/${APP_BIN}.png"
          fi

          cat > "$PKG/DEBIAN/control" <<EOF
          Package: qnd-updater
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: efedotof <efedotof@users.noreply.github.com>
          Description: ${APP_PROD}
          Depends: libgtk-3-0 | libgtk-3-0t64, libglu1-mesa
          Section: utils
          Priority: optional
          EOF

          dpkg-deb --build "$PKG" "$GITHUB_WORKSPACE/dist/qnd-updater-${VERSION}-linux.deb"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  build-macos:
    name: macOS Universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter config --enable-native-assets
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      - name: Detect bundle name
        id: bundle
        run: |
          NAME=$(grep -E '^\s*PRODUCT_NAME\s*=' macos/Runner/Configs/AppInfo.xcconfig \
                 | head -1 | sed 's/.*= *//' | tr -d '[:space:]')
          echo "name=${NAME:-Runner}" >> $GITHUB_OUTPUT
          echo "Bundle name: ${NAME:-Runner}"

      - name: Build arm64
        env: { FLUTTER_XCODE_ARCHS: arm64 }
        run: flutter build macos --release
      - run: |
          mkdir -p /tmp/arm
          cp -R build/macos/Build/Products/Release/*.app /tmp/arm/

      - name: Clean
        run: |
          flutter clean
          flutter pub get

      - name: Build x86_64
        env:
          FLUTTER_XCODE_ARCHS: x86_64
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "NO"
        run: flutter build macos --release
      - run: |
          mkdir -p /tmp/intel
          cp -R build/macos/Build/Products/Release/*.app /tmp/intel/

      - name: lipo merge
        run: |
          set -e
          B="${{ steps.bundle.outputs.name }}"
          U=/tmp/universal/$B.app
          mkdir -p /tmp/universal
          cp -R "/tmp/arm/$B.app" "$U"
          MAIN=$(ls "$U/Contents/MacOS/" | head -n1)
          lipo -create "/tmp/arm/$B.app/Contents/MacOS/$MAIN" \
                       "/tmp/intel/$B.app/Contents/MacOS/$MAIN" \
                       -output "$U/Contents/MacOS/$MAIN"
          for fw in "$U/Contents/Frameworks/"*.framework; do
            n=$(basename "$fw" .framework)
            bin="$fw/Versions/A/$n"; [ -f "$bin" ] || bin="$fw/$n"
            a="/tmp/arm/$B.app/Contents/Frameworks/$n.framework/Versions/A/$n"
            i="/tmp/intel/$B.app/Contents/Frameworks/$n.framework/Versions/A/$n"
            [ -f "$a" ] && [ -f "$i" ] && lipo -create "$a" "$i" -output "$bin"
          done

      - name: Sign
        run: |
          cat > /tmp/ent.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.network.client</key><true/>
          </dict></plist>
          EOF
          find /tmp/universal -type d -name _CodeSignature -prune -exec rm -rf {} + 2>/dev/null || true
          codesign --force --deep --sign - --entitlements /tmp/ent.plist /tmp/universal/*.app
          codesign -d --entitlements - /tmp/universal/*.app
          codesign -d --entitlements :- /tmp/universal/*.app | grep -i sandbox && exit 1 || true

      - name: ZIP via ditto
        run: |
          TAG="${{ github.ref_name }}"
          B="${{ steps.bundle.outputs.name }}"
          mkdir -p dist
          ( cd /tmp/universal && ditto -c -k --rsrc --extattr --keepParent "$B.app" \
              "$GITHUB_WORKSPACE/dist/qnd_updater-${TAG}-macos.zip" )

      - name: DMG
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          B="${{ steps.bundle.outputs.name }}"
          rm -rf /tmp/dmg && mkdir -p /tmp/dmg/.payload
          ditto /tmp/universal "$B.app" "/tmp/dmg/.payload/$B.app"

          cat > /tmp/dmg/Установить.command <<SCRIPT
          #!/bin/bash
          set -e
          DIR="\$(cd "\$(dirname "\$0")" && pwd)"
          SRC="\$DIR/.payload/$B.app"
          DEST="/Applications/$B.app"
          rm -rf "\$DEST"
          /usr/bin/ditto "\$SRC" "\$DEST"
          /usr/bin/xattr -cr "\$DEST"
          open "\$DEST"
          SCRIPT
          chmod +x /tmp/dmg/Установить.command

          cat > /tmp/dmg/ПРОЧТИ_МЕНЯ.txt <<EOF
          Установка
          =========
          1. Правый клик по "Установить.command" → "Открыть".
          2. В предупреждении macOS нажать "Открыть" ещё раз.
          Скрипт скопирует приложение в /Applications и запустит.
          EOF

          ln -s /Applications /tmp/dmg/Applications
          SetFile -a V /tmp/dmg/.payload || true
          hdiutil create -volname "${{ env.APP_PRODUCT }} ${TAG}" \
            -srcfolder /tmp/dmg -ov -format UDZO \
            "dist/qnd_updater-${TAG}-macos.dmg"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    name: Publish release
    needs: [build-android, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }

      - name: Verify required assets
        run: |
          set -e
          REQ=("*-android.zip" "*.apk" "*-windows.zip" "*-windows-setup.exe"
               "*-macos.zip" "*-macos.dmg" "*-linux.zip" "*-linux-setup.run"
               "*-linux.deb" "*-linux.AppImage")
          for p in "${REQ[@]}"; do
            ls dist/$p >/dev/null 2>&1 || { echo "::error::missing $p"; exit 1; }
          done
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.apk
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.run