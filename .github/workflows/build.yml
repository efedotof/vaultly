name: Build and Release Desktop and Android Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Create key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../upload-keystore.p12
          EOF

      - name: Decode keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $ENCODED_STRING > keystore-b64.txt
          base64 -d keystore-b64.txt > android/upload-keystore.p12

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build signed APK
        run: flutter build apk --release

      - name: Get version from pubspec
        id: version
        run: |
          version=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Upload APK to release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    build-windows:
    name: Build for Windows (Velopack)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'

      - name: Enable windows support
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Windows app (release)
        run: flutter build windows --release

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk

      - name: Get version from pubspec (clean)
        id: version
        shell: bash
        run: |
          raw_version=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          clean_version="${raw_version%%+*}"
          echo "clean_version=$clean_version" >> $GITHUB_OUTPUT
          echo "Raw: $raw_version -> Clean: $clean_version"

      - name: Copy icon for Velopack
        run: |
          if (Test-Path "windows/runner/resources/app_icon.ico") {
            Copy-Item "windows/runner/resources/app_icon.ico" -Destination "build/windows/x64/runner/Release/app.ico"
            Write-Host "Icon copied successfully"
          } else {
            Write-Host "::warning::Icon not found at windows/runner/resources/app_icon.ico"
          }

      - name: Pack Windows with Velopack
        run: |
          vpk pack --name "Vaultly" --version "${{ steps.version.outputs.clean_version }}" --platform "windows-x64" --output "./artifacts" --input "build/windows/x64/runner/Release" --icon "build/windows/x64/runner/Release/app.ico"

      - name: Upload Windows artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/*.exe
            ./artifacts/*.nupkg
            ./artifacts/releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build for macOS (Velopack)
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'

      - name: Enable macOS support
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build macOS app (release)
        run: flutter build macos --release

      - name: Rename app to vaulth_app.app if needed
        run: |
          if [ -d "build/macos/Build/Products/Release/Vaultly.app" ]; then
            mv build/macos/Build/Products/Release/Vaultly.app build/macos/Build/Products/Release/vaulth_app.app
          fi

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk

      - name: Get version from pubspec (clean)
        id: version
        shell: bash
        run: |
          raw_version=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          clean_version="${raw_version%%+*}"
          echo "clean_version=$clean_version" >> $GITHUB_OUTPUT
          echo "Raw: $raw_version -> Clean: $clean_version"

      - name: Pack macOS with Velopack
        run: |
          vpk pack -u Vaultly -v ${{ steps.version.outputs.clean_version }} -p osx-x64 -o ./artifacts -i build/macos/Build/Products/Release

      - name: Upload macOS artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/*.dmg
            ./artifacts/*.nupkg
            ./artifacts/releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}